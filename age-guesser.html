<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Guesser — powered by Agify</title>
<style>
  :root {
    --ink: #1c1b1a;
    --paper: #faf7f2;
    --line: #d8d2c6;
    --brass: #8a6d3b;
    --brass-dark: #6b5228;
    --muted: #6f6a60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--line);
    padding: 40px 32px;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid var(--line);
    pointer-events: none;
  }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 6px; font-weight: 400; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 32px; font-style: italic; }
  label { display: block; font-size: 0.8rem; letter-spacing: 0.02em; color: var(--muted); margin-bottom: 8px; }
  input[type="text"] {
    width: 100%; font-family: inherit; font-size: 1.05rem; padding: 10px 2px;
    border: none; border-bottom: 1px solid var(--ink); background: transparent;
    color: var(--ink); outline: none;
  }
  input[type="text"]:focus { border-bottom: 2px solid var(--brass); }
  button {
    margin-top: 24px; width: 100%; padding: 13px; background: var(--ink);
    color: var(--paper); border: none; font-family: inherit; font-size: 0.95rem;
    letter-spacing: 0.03em; cursor: pointer; transition: background 0.15s ease;
  }
  button:hover { background: var(--brass-dark); }
  button:disabled { background: var(--muted); cursor: default; }
  .result { margin-top: 32px; min-height: 90px; }
  .result .age { font-size: 3.2rem; line-height: 1; color: var(--brass-dark); margin: 0; }
  .result .caption { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; }
  .error { color: #8a3b3b; font-size: 0.9rem; margin-top: 20px; }
  footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.75rem; color: var(--muted); }
  footer a { color: var(--brass-dark); }
</style>
</head>
<body>

<div class="card">
  <h1>How old does your name sound?</h1>
  <p class="sub">A small experiment using the public Agify API.</p>

  <label for="nameInput">Name</label>
  <input type="text" id="nameInput" placeholder="e.g. Ibrahim" autocomplete="off">

  <button id="guessBtn">Guess the age</button>

  <div class="result" id="result"></div>

  <footer>
    Built by Ibrahim &middot; data from
    <a href="https://agify.io" target="_blank" rel="noopener">agify.io</a>
  </footer>
</div>

<script>
  const input = document.getElementById('nameInput');
  const button = document.getElementById('guessBtn');
  const result = document.getElementById('result');

  async function guessAge() {
    const name = input.value.trim();
    result.innerHTML = '';

    if (!name) {
      result.innerHTML = '<p class="error">Type a name first.</p>';
      return;
    }

    button.disabled = true;
    button.textContent = 'Asking Agify…';

    try {
      const response = await fetch(`https://api.agify.io?name=${encodeURIComponent(name)}`);
      const data = await response.json();

      if (data.age === null || data.age === undefined) {
        result.innerHTML = `<p class="error">No prediction found for "${name}".</p>`;
      } else {
        result.innerHTML = `
          <p class="age">${data.age}</p>
          <p class="caption">predicted age for "${data.name}" &middot; based on ${data.count.toLocaleString()} people</p>
        `;
      }
    } catch (err) {
      result.innerHTML = '<p class="error">Something went wrong reaching the API. Try again.</p>';
    } finally {
      button.disabled = false;
      button.textContent = 'Guess the age';
    }
  }

  button.addEventListener('click', guessAge);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') guessAge();
  });
</script>

</body>
  </html>
